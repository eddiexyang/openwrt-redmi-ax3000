name: CR8809 M79A Linux 6.12 NSS
on:
  push:
    branches: [cr8809-m79a-linux-6.12-nss]
    paths: ['cr8809/**', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cr8809-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CR8809_WORK_DIR: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cr8809
          persist-credentials: false
      - name: Prepare unprivileged host tools
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/cr8809-host-tools"
          mkdir -p "$deps/debs" "$deps/root"
          cd "$deps/debs"
          apt-get download gawk libsigsegv2 flex bison gettext gettext-base libfl2 libfl-dev libelf-dev python3-pyelftools
          for deb in ./*.deb; do dpkg-deb --extract "$deb" "$deps/root"; done
          echo "$deps/root/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$deps/root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=$deps/root/usr/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$deps/root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$deps/root/usr/lib/python3/dist-packages" >> "$GITHUB_ENV"
      - name: Prepare M79A board, NSS and AES sources
        shell: bash
        run: |
          set -euo pipefail
          bash cr8809/prepare.sh 2>&1 | tee prepare.log
      - name: Download build inputs
        working-directory: work/nss-port/openwrt
        run: make -j8 download
      - name: Compile firmware
        working-directory: work/nss-port/openwrt
        shell: bash
        run: |
          set -euo pipefail
          make -j2 V=s 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Verify output and record checksums
        working-directory: work/nss-port/openwrt
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find bin/targets/qualcommax/ipq50xx -maxdepth 1 -name '*cr880x-m79-v1*' -print -quit)"
          cp cr8809-provenance.json cr8809.config.buildinfo bin/targets/qualcommax/ipq50xx/
          cd bin/targets/qualcommax/ipq50xx
          sha256sum *cr880x-m79-v1* > cr8809-sha256sums
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr8809-m79a-6.12-experimental-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
          path: |
            prepare.log
            build.log
            work/nss-port/openwrt/.config
            work/nss-port/openwrt/cr8809-feeds-lock.json
            work/nss-port/openwrt/cr8809-provenance.json
            work/nss-port/openwrt/cr8809.config.buildinfo
            work/nss-port/openwrt/bin/targets/qualcommax/ipq50xx/*cr880x-m79-v1*
            work/nss-port/openwrt/bin/targets/qualcommax/ipq50xx/cr8809-sha256sums
            work/nss-port/openwrt/logs/**/error.txt
